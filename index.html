<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Treino</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --texto: #1c1f24; --suave: #6b7280;
    --borda: #e2e5ea; --destaque: #e4572e; --destaque-2: #2e86ab; --ok: #2f9e44; --erro: #c92a2a;
    --raio: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --card: #1b1e24; --texto: #eceef2; --suave: #9aa1ad; --borda: #2c313a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--texto);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 80px; }
  h1 { font-size: 1.5rem; margin: 8px 0 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: var(--raio);
          padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: .85rem; color: var(--suave); margin-bottom: 4px; }
  input, select, textarea, button { font: inherit; }
  input, select, textarea { width: 100%; padding: 11px 12px; border-radius: 10px;
          border: 1px solid var(--borda); background: var(--bg); color: var(--texto); }
  .campo { margin-bottom: 12px; }
  .series { list-style: none; margin: 0 0 10px; padding: 0; }
  .serie, .series-cabecalho { display: grid; grid-template-columns: 2rem 1fr 1fr 2.5rem; gap: 8px; align-items: center; }
  .serie { margin-bottom: 8px; }
  .series-cabecalho { font-size: .85rem; color: var(--suave); margin-bottom: 4px; }
  .serie .num { text-align: center; font-weight: 600; color: var(--suave); }
  .serie .apagar:disabled { visibility: hidden; }
  #add-serie { width: 100%; }
  button { cursor: pointer; border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 600; }
  .primario { background: var(--destaque); color: #fff; width: 100%; }
  .secundario { background: transparent; color: var(--texto); border: 1px solid var(--borda); }
  .linha { display: flex; gap: 10px; }
  .linha > * { flex: 1; }
  .ou { display: flex; align-items: center; gap: 10px; color: var(--suave); font-size: .85rem; margin: 14px 0; }
  .ou::before, .ou::after { content: ""; flex: 1; border-top: 1px solid var(--borda); }
  #entrar-google { width: 100%; }
  .topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .topo small { color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topo button { padding: 8px 12px; }

  nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 14px;
        background: var(--card); border: 1px solid var(--borda); border-radius: var(--raio); padding: 5px; }
  nav button { background: transparent; color: var(--suave); padding: 10px 2px; font-size: .85rem; }
  nav button[aria-selected="true"] { background: var(--destaque); color: #fff; }

  #ultimo { font-size: .9rem; color: var(--destaque-2); min-height: 1.3em; margin: -4px 0 12px; }

  .dia h3, .marco h3 { font-size: .9rem; color: var(--suave); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .lista ul { list-style: none; margin: 0; padding: 0; }
  .lista li { display: flex; justify-content: space-between; align-items: center; gap: 10px;
              padding: 10px 0; border-top: 1px solid var(--borda); }
  .lista li:first-child { border-top: 0; }
  .lista li span, .lista li small { display: block; color: var(--suave); font-size: .9rem; }
  .apagar, .editar { background: transparent; color: var(--suave); font-size: 1.3rem; padding: 4px 10px; }
  .apagar:hover { color: var(--erro); }
  .editar { font-size: 1.1rem; }
  .editar:hover { color: var(--destaque-2); }
  .vazio { color: var(--suave); text-align: center; margin: 20px 0; }

  .resumo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .resumo div { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .resumo b { display: block; font-size: 1.2rem; }
  .resumo span { font-size: .8rem; color: var(--suave); }
  .grafico-box { position: relative; height: 290px; }
  .alternar { display: flex; gap: 6px; margin-bottom: 10px; }
  .alternar button { flex: 1; padding: 8px; background: transparent; color: var(--suave); border: 1px solid var(--borda); }
  .alternar button[aria-pressed="true"] { background: var(--destaque-2); color: #fff; border-color: var(--destaque-2); }
  .marco + .marco { margin-top: 14px; }
  .marco ul { list-style: none; margin: 0; padding: 0; }
  .marco li { padding: 3px 0; }
  .sobe { color: var(--ok); }
  .desce { color: var(--erro); }
  .neutro { color: var(--suave); }

  #aviso { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 150%);
           background: var(--ok); color: #fff; padding: 12px 18px; border-radius: 10px;
           transition: transform .25s; max-width: calc(100% - 32px); z-index: 10; }
  #aviso.visivel { transform: translate(-50%, 0); }
  #aviso.erro { background: var(--erro); }
</style>
</head>
<body>
<main>
  <!-- ============ LOGIN ============ -->
  <section id="tela-login" hidden>
    <h1>🏋️ Meu Treino</h1>
    <form id="form-login" class="card">
      <h2>Entrar</h2>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="senha">Senha (mínimo 6 caracteres)</label>
        <input id="senha" type="password" minlength="6" autocomplete="current-password" required>
      </div>
      <div class="linha">
        <button class="primario" value="entrar">Entrar</button>
        <button class="secundario" value="cadastrar">Criar conta</button>
      </div>
      <div class="ou">ou</div>
      <button id="entrar-google" class="secundario" type="button">Entrar com Google</button>
    </form>
  </section>

  <!-- ============ APP ============ -->
  <section id="tela-app" hidden>
    <div class="topo">
      <h1>🏋️ Meu Treino</h1>
      <div style="text-align:right; min-width:0">
        <small id="usuario"></small><br>
        <button id="sair" class="secundario">Sair</button>
      </div>
    </div>

    <nav role="tablist">
      <button class="aba-botao" data-aba="registrar" aria-selected="true">Registrar</button>
      <button class="aba-botao" data-aba="historico" aria-selected="false">Histórico</button>
      <button class="aba-botao" data-aba="evolucao" aria-selected="false">Evolução</button>
      <button class="aba-botao" data-aba="exercicios" aria-selected="false">Exercícios</button>
    </nav>

    <!-- Registrar -->
    <div id="aba-registrar" class="aba">
      <form id="form-registro" class="card">
        <h2>Novo registro</h2>
        <div class="campo">
          <label for="exercicio">Exercício</label>
          <select id="exercicio" required></select>
        </div>
        <p id="ultimo"></p>
        <div class="campo">
          <label for="data">Data</label>
          <input id="data" type="date" required>
        </div>
        <div class="campo">
          <div class="series-cabecalho" aria-hidden="true">
            <span>Série</span><span>Carga (kg)</span><span>Repetições</span>
          </div>
          <ol id="lista-series" class="series"></ol>
          <button id="add-serie" class="secundario" type="button">+ Adicionar série</button>
        </div>
        <div class="campo">
          <label for="observacao">Observação (opcional)</label>
          <input id="observacao" type="text" placeholder="Ex.: última série até a falha">
        </div>
        <button class="primario">Salvar registro</button>
      </form>
    </div>

    <!-- Histórico -->
    <div id="aba-historico" class="aba" hidden>
      <div id="lista-historico"></div>
    </div>

    <!-- Evolução -->
    <div id="aba-evolucao" class="aba" hidden>
      <div class="card">
        <div class="campo">
          <label for="evo-exercicio">Exercício</label>
          <select id="evo-exercicio"></select>
        </div>
        <div id="evo-resumo" class="resumo"></div>
        <div id="evo-grafico" hidden>
          <div class="alternar">
            <button data-metrica="carga" aria-pressed="true">Carga por série</button>
            <button data-metrica="repeticoes" aria-pressed="false">Repetições por série</button>
          </div>
          <div class="grafico-box"><canvas id="grafico"></canvas></div>
        </div>
      </div>
      <div id="evo-marcos" class="card" hidden></div>
    </div>

    <!-- Exercícios -->
    <div id="aba-exercicios" class="aba" hidden>
      <form id="form-exercicio" class="card">
        <h2 id="titulo-exercicio">Novo exercício</h2>
        <div class="campo">
          <label for="novo-nome">Nome</label>
          <input id="novo-nome" type="text" maxlength="80" placeholder="Ex.: Supino reto" required>
        </div>
        <div class="campo">
          <label for="novo-grupo">Grupo muscular (opcional)</label>
          <input id="novo-grupo" type="text" list="grupos" placeholder="Ex.: Peito">
          <datalist id="grupos">
            <option>Peito</option><option>Costas</option><option>Pernas</option>
            <option>Ombros</option><option>Bíceps</option><option>Tríceps</option>
            <option>Abdômen</option><option>Glúteos</option><option>Panturrilha</option>
          </datalist>
        </div>
        <div class="linha">
          <button id="cancelar-edicao" class="secundario" type="button" hidden>Cancelar</button>
          <button id="salvar-exercicio" class="primario">Adicionar exercício</button>
        </div>
      </form>

      <div id="lista-exercicios"></div>
    </div>
  </section>
</main>
<div id="aviso" role="status"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  // ================================================================
  //  CONFIGURAÇÃO — cole aqui os dados do seu projeto Supabase
  //  (painel do projeto → botão "Connect" ou Project Settings → API)
  // ================================================================
  const SUPABASE_URL = 'https://aqymnknfwjiyhqzwyuas.supabase.co';        // ex.: https://abcd1234.supabase.co
  const SUPABASE_KEY = 'sb_publishable_Io1jQve-Tf8JA0BTiyxOwg_j2C1McYY';         // chave "publishable" ou "anon"
  // ================================================================

  const $ = (seletor) => document.querySelector(seletor);

  if (SUPABASE_URL.startsWith('COLE_AQUI')) {
    $('main').innerHTML = '<div class="card"><h2>Falta configurar</h2>' +
      '<p>Abra o <code>index.html</code> e preencha <code>SUPABASE_URL</code> e ' +
      '<code>SUPABASE_KEY</code> no início do script. O README explica onde encontrar.</p></div>';
    throw new Error('Supabase não configurado');
  }

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---------- utilidades ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function hoje() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }
  function fmtData(iso) {
    const [a, m, d] = iso.split('-');
    return `${d}/${m}/${a}`;
  }
  const fmtNum = (n) => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const fmtKg = (n) => fmtNum(n) + ' kg';
  const fmtSerie = (s) => `${fmtKg(s.carga)} × ${s.repeticoes}`;

  let timerAviso;
  function aviso(msg, erro = false) {
    const t = $('#aviso');
    t.textContent = msg;
    t.className = erro ? 'erro visivel' : 'visivel';
    clearTimeout(timerAviso);
    timerAviso = setTimeout(() => { t.className = ''; }, 3500);
  }

  // ---------- autenticação ----------
  $('#form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim();
    const password = $('#senha').value;

    if (e.submitter?.value === 'cadastrar') {
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) return aviso(error.message, true);
      if (!data.session) aviso('Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre.');
    } else {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return aviso('Não foi possível entrar: ' + error.message, true);
    }
  });

  // Redireciona para o Google; na volta o supabase-js lê a sessão da URL e dispara onAuthStateChange
  $('#entrar-google').addEventListener('click', async () => {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.origin + location.pathname },
    });
    if (error) aviso('Não foi possível entrar com Google: ' + error.message, true);
  });

  $('#sair').addEventListener('click', () => supabase.auth.signOut());

  let usuarioAtual = null;
  // setTimeout evita chamar o Supabase de dentro do callback (recomendação da documentação)
  supabase.auth.onAuthStateChange((_evento, session) => {
    setTimeout(() => mostrarTela(session), 0);
  });

  async function mostrarTela(session) {
    const logado = Boolean(session);
    $('#tela-login').hidden = logado;
    $('#tela-app').hidden = !logado;
    if (!logado) { usuarioAtual = null; return; }
    if (usuarioAtual === session.user.id) return;   // ex.: renovação de token

    usuarioAtual = session.user.id;
    $('#usuario').textContent = session.user.email;
    $('#data').value = hoje();
    cancelarEdicao();
    abrirAba('registrar');
    await carregarExercicios();
    mostrarUltimo(Number($('#exercicio').value));
  }

  // ---------- abas ----------
  document.querySelectorAll('.aba-botao').forEach((b) =>
    b.addEventListener('click', () => abrirAba(b.dataset.aba)));

  function abrirAba(nome) {
    document.querySelectorAll('.aba-botao').forEach((b) =>
      b.setAttribute('aria-selected', String(b.dataset.aba === nome)));
    document.querySelectorAll('.aba').forEach((s) => { s.hidden = s.id !== 'aba-' + nome; });
    if (nome === 'historico') carregarHistorico();
    if (nome === 'evolucao') desenharEvolucao();
  }

  // ---------- exercícios ----------
  let exercicios = [];
  let editandoId = null;

  async function carregarExercicios() {
    const { data, error } = await supabase
      .from('exercicios')
      .select('id, nome, grupo_muscular')
      .order('nome');
    if (error) return aviso(error.message, true);
    exercicios = data;

    const opcoes = data.map((e) =>
      `<option value="${e.id}">${esc(e.nome)}${e.grupo_muscular ? ' · ' + esc(e.grupo_muscular) : ''}</option>`
    ).join('');
    // Recria as opções mantendo o exercício que já estava selecionado
    for (const [seletor, vazio] of [
      ['#exercicio', 'Cadastre um exercício na aba Exercícios'],
      ['#evo-exercicio', 'Nenhum exercício cadastrado'],
    ]) {
      const select = $(seletor);
      const anterior = select.value;
      select.innerHTML = opcoes || `<option value="">${vazio}</option>`;
      if (data.some((e) => String(e.id) === anterior)) select.value = anterior;
    }

    $('#lista-exercicios').innerHTML = data.length ? `
      <div class="card lista">
        <h2>Cadastrados (${data.length})</h2>
        <ul>
          ${data.map((e) => `
            <li>
              <div>
                <strong>${esc(e.nome)}</strong>
                ${e.grupo_muscular ? `<span>${esc(e.grupo_muscular)}</span>` : ''}
              </div>
              <button class="editar" data-id="${e.id}" aria-label="Editar ${esc(e.nome)}">✎</button>
            </li>`).join('')}
        </ul>
      </div>`
      : '<div class="card"><p class="vazio">Nenhum exercício cadastrado ainda.</p></div>';
  }

  function cancelarEdicao() {
    editandoId = null;
    $('#form-exercicio').reset();
    $('#titulo-exercicio').textContent = 'Novo exercício';
    $('#salvar-exercicio').textContent = 'Adicionar exercício';
    $('#cancelar-edicao').hidden = true;
  }

  $('#cancelar-edicao').addEventListener('click', cancelarEdicao);

  $('#lista-exercicios').addEventListener('click', (e) => {
    const botao = e.target.closest('.editar');
    const exercicio = botao && exercicios.find((x) => String(x.id) === botao.dataset.id);
    if (!exercicio) return;

    editandoId = exercicio.id;
    $('#novo-nome').value = exercicio.nome;
    $('#novo-grupo').value = exercicio.grupo_muscular ?? '';
    $('#titulo-exercicio').textContent = 'Editar exercício';
    $('#salvar-exercicio').textContent = 'Salvar alterações';
    $('#cancelar-edicao').hidden = false;
    $('#form-exercicio').scrollIntoView({ behavior: 'smooth' });
    $('#novo-nome').focus({ preventScroll: true });
  });

  $('#form-exercicio').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = $('#novo-nome').value.trim();
    const grupo_muscular = $('#novo-grupo').value.trim() || null;
    if (!nome) return;

    const editando = editandoId !== null;
    const consulta = editando
      ? supabase.from('exercicios').update({ nome, grupo_muscular }).eq('id', editandoId)
      : supabase.from('exercicios').insert({ nome, grupo_muscular });
    const { data, error } = await consulta.select().single();
    if (error) {
      return aviso(error.code === '23505' ? 'Você já tem um exercício com esse nome.' : error.message, true);
    }
    cancelarEdicao();
    await carregarExercicios();
    if (editando) return aviso('Exercício atualizado.');

    $('#exercicio').value = data.id;
    mostrarUltimo(data.id);
    aviso('Exercício adicionado.');
  });

  // ---------- registros ----------
  // Cada registro guarda as séries como lista: [{ carga, repeticoes }, ...]
  const SERIES_PADRAO = Array.from({ length: 3 }, () => ({ carga: '', repeticoes: 10 }));

  const linhaSerie = (s) => `
    <li class="serie">
      <span class="num"></span>
      <input class="s-carga" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(s.carga)}" required>
      <input class="s-reps" type="number" inputmode="numeric" min="1" value="${esc(s.repeticoes)}" required>
      <button class="apagar" type="button">×</button>
    </li>`;

  function preencherSeries(series) {
    $('#lista-series').innerHTML = series.map(linhaSerie).join('');
    numerarSeries();
  }

  // Renumera as linhas e só deixa remover quando há mais de uma série
  function numerarSeries() {
    const linhas = document.querySelectorAll('#lista-series li');
    linhas.forEach((li, i) => {
      li.querySelector('.num').textContent = i + 1;
      li.querySelector('.s-carga').setAttribute('aria-label', `Carga da série ${i + 1} (kg)`);
      li.querySelector('.s-reps').setAttribute('aria-label', `Repetições da série ${i + 1}`);
      li.querySelector('.apagar').setAttribute('aria-label', `Remover série ${i + 1}`);
      li.querySelector('.apagar').disabled = linhas.length === 1;
    });
  }

  const lerSeries = () => [...document.querySelectorAll('#lista-series li')].map((li) => ({
    carga: Number(li.querySelector('.s-carga').value),
    repeticoes: Number(li.querySelector('.s-reps').value),
  }));

  // Nova série começa com os valores da última
  $('#add-serie').addEventListener('click', () => {
    const ultima = $('#lista-series li:last-child');
    $('#lista-series').insertAdjacentHTML('beforeend', linhaSerie({
      carga: ultima.querySelector('.s-carga').value,
      repeticoes: ultima.querySelector('.s-reps').value,
    }));
    numerarSeries();
    $('#lista-series li:last-child .s-carga').focus();
  });

  $('#lista-series').addEventListener('click', (e) => {
    const botao = e.target.closest('.apagar');
    if (!botao) return;
    botao.closest('li').remove();
    numerarSeries();
  });

  preencherSeries(SERIES_PADRAO);

  async function mostrarUltimo(exercicioId) {
    const alvo = $('#ultimo');
    alvo.textContent = '';
    if (!exercicioId) return;

    const { data } = await supabase
      .from('registros')
      .select('data, series')
      .eq('exercicio_id', exercicioId)
      .order('data', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(1);

    if (data?.length) {
      const r = data[0];
      alvo.textContent = `Última vez (${fmtData(r.data)}): ${r.series.map(fmtSerie).join(' · ')}`;
      preencherSeries(r.series);
    } else {
      alvo.textContent = 'Primeiro registro deste exercício.';
      preencherSeries(SERIES_PADRAO);
    }
  }

  $('#exercicio').addEventListener('change', (e) => mostrarUltimo(Number(e.target.value)));

  $('#form-registro').addEventListener('submit', async (e) => {
    e.preventDefault();
    const registro = {
      exercicio_id: Number($('#exercicio').value),
      data: $('#data').value,
      series: lerSeries(),
      observacao: $('#observacao').value.trim() || null,
    };
    if (!registro.exercicio_id) return aviso('Cadastre e escolha um exercício primeiro.', true);

    const botao = e.submitter;
    botao.disabled = true;
    const { error } = await supabase.from('registros').insert(registro);
    botao.disabled = false;
    if (error) return aviso(error.message, true);

    $('#observacao').value = '';
    aviso('Treino registrado! 💪');
    mostrarUltimo(registro.exercicio_id);
  });

  // ---------- histórico ----------
  async function carregarHistorico() {
    const lista = $('#lista-historico');
    const { data, error } = await supabase
      .from('registros')
      .select('id, data, series, observacao, exercicios(nome)')
      .order('data', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(150);
    if (error) return aviso(error.message, true);

    if (!data.length) {
      lista.innerHTML = '<div class="card"><p class="vazio">Nenhum treino registrado ainda.</p></div>';
      return;
    }

    const porDia = new Map();
    for (const r of data) {
      if (!porDia.has(r.data)) porDia.set(r.data, []);
      porDia.get(r.data).push(r);
    }

    lista.innerHTML = [...porDia].map(([dia, itens]) => `
      <div class="card dia lista">
        <h3>${fmtData(dia)}</h3>
        <ul>
          ${itens.map((r) => `
            <li>
              <div>
                <strong>${esc(r.exercicios?.nome ?? '—')}</strong>
                <span>${r.series.length} ${r.series.length === 1 ? 'série' : 'séries'}: ${r.series.map(fmtSerie).join(' · ')}</span>
                ${r.observacao ? `<small>${esc(r.observacao)}</small>` : ''}
              </div>
              <button class="apagar" data-id="${r.id}" aria-label="Apagar registro">×</button>
            </li>`).join('')}
        </ul>
      </div>`).join('');
  }

  $('#lista-historico').addEventListener('click', async (e) => {
    const botao = e.target.closest('.apagar');
    if (!botao || !confirm('Apagar este registro?')) return;
    const { error } = await supabase.from('registros').delete().eq('id', botao.dataset.id);
    if (error) return aviso(error.message, true);
    aviso('Registro apagado.');
    carregarHistorico();
  });

  // ---------- evolução ----------
  const CORES = ['#e4572e', '#2e86ab', '#2f9e44', '#f08c00', '#7048e8', '#d6336c'];
  let grafico = null;
  let sessoes = [];          // registros do exercício escolhido, do mais antigo ao mais recente
  let metrica = 'carga';     // 'carga' ou 'repeticoes'

  async function desenharEvolucao() {
    const resumo = $('#evo-resumo');
    const exercicioId = Number($('#evo-exercicio').value);
    sessoes = [];
    $('#evo-grafico').hidden = true;
    $('#evo-marcos').hidden = true;
    if (grafico) { grafico.destroy(); grafico = null; }

    if (!exercicioId) {
      resumo.innerHTML = '<p class="vazio" style="grid-column:1/-1">Cadastre um exercício para ver a evolução.</p>';
      return;
    }

    const { data, error } = await supabase
      .from('registros')
      .select('data, series')
      .eq('exercicio_id', exercicioId)
      .order('data')
      .order('created_at');
    if (error) return aviso(error.message, true);

    if (!data.length) {
      resumo.innerHTML = '<p class="vazio" style="grid-column:1/-1">Ainda não há registros deste exercício.</p>';
      return;
    }

    sessoes = data.map((r) => ({
      data: r.data,
      series: r.series.map((s) => ({ carga: Number(s.carga), repeticoes: Number(s.repeticoes) })),
    }));

    // Resumo: recorde de carga, melhor 1RM estimado (fórmula de Epley) e variação da maior carga
    const todas = sessoes.flatMap((s) => s.series);
    const maiorCarga = (sessao) => Math.max(...sessao.series.map((s) => s.carga));
    const recorde = Math.max(...todas.map((s) => s.carga));
    const rm = Math.max(...todas.map((s) => s.carga * (1 + s.repeticoes / 30)));
    const primeira = maiorCarga(sessoes[0]);
    const atual = maiorCarga(sessoes.at(-1));
    const variacao = primeira > 0
      ? `${((atual - primeira) / primeira * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1, signDisplay: 'exceptZero' })}%`
      : '—';

    resumo.innerHTML = `
      <div><b>${fmtKg(recorde)}</b><span>Recorde de carga</span></div>
      <div><b>${fmtKg(rm.toFixed(1))}</b><span>Melhor 1RM estimado</span></div>
      <div><b>${variacao}</b><span>Maior carga desde o 1º registro</span></div>
      <div><b>${sessoes.length}</b><span>Sessões registradas</span></div>`;

    $('#evo-grafico').hidden = false;
    desenharGrafico();
    mostrarMarcos();
  }

  // Uma linha por série (Série 1, Série 2, ...) com a carga ou as repetições de cada sessão
  function desenharGrafico() {
    if (grafico) { grafico.destroy(); grafico = null; }
    if (!sessoes.length) return;

    const qtdSeries = Math.max(...sessoes.map((s) => s.series.length));
    const corTexto = getComputedStyle(document.body).color;
    grafico = new Chart($('#grafico'), {
      type: 'line',
      data: {
        labels: sessoes.map((s) => fmtData(s.data)),
        datasets: Array.from({ length: qtdSeries }, (_, n) => {
          const cor = CORES[n % CORES.length];
          return {
            label: `Série ${n + 1}`,
            data: sessoes.map((s) => s.series[n]?.[metrica] ?? null),
            borderColor: cor, backgroundColor: cor, tension: 0.25, spanGaps: true,
          };
        }),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: corTexto } },
          tooltip: {
            filter: (item) => item.raw !== null,
            callbacks: {
              label: (ctx) => `Série ${ctx.datasetIndex + 1}: ${fmtSerie(sessoes[ctx.dataIndex].series[ctx.datasetIndex])}`,
            },
          },
        },
        scales: {
          x: { ticks: { color: corTexto } },
          y: { ticks: { color: corTexto, precision: metrica === 'repeticoes' ? 0 : undefined },
               title: { display: true, text: metrica === 'carga' ? 'kg' : 'repetições', color: corTexto } },
        },
      },
    });
  }

  // Compara cada sessão com a anterior, série a série, e lista o que mudou
  function mostrarMarcos() {
    const marcos = [];
    for (let i = 1; i < sessoes.length; i++) {
      const antes = sessoes[i - 1].series;
      const agora = sessoes[i].series;
      const mudancas = [];
      for (let n = 0; n < Math.max(antes.length, agora.length); n++) {
        const a = antes[n];
        const s = agora[n];
        if (!a) { mudancas.push({ n, tipo: 'neutro', texto: `nova série (${fmtSerie(s)})` }); continue; }
        if (!s) { mudancas.push({ n, tipo: 'neutro', texto: 'não realizada' }); continue; }
        if (s.carga !== a.carga) {
          mudancas.push({ n, tipo: s.carga > a.carga ? 'sobe' : 'desce',
                          texto: `carga ${fmtNum(a.carga)} → ${fmtKg(s.carga)}` });
        }
        if (s.repeticoes !== a.repeticoes) {
          mudancas.push({ n, tipo: s.repeticoes > a.repeticoes ? 'sobe' : 'desce',
                          texto: `${a.repeticoes} → ${s.repeticoes} repetições` });
        }
      }
      if (mudancas.length) marcos.push({ data: sessoes[i].data, mudancas });
    }

    const setas = { sobe: '▲', desce: '▼', neutro: '•' };
    $('#evo-marcos').hidden = false;
    $('#evo-marcos').innerHTML = '<h2>Mudanças por série</h2>' + (marcos.length
      ? marcos.reverse().map((m) => `
          <div class="marco">
            <h3>${fmtData(m.data)}</h3>
            <ul>
              ${m.mudancas.map((c) => `
                <li><span class="${c.tipo}">${setas[c.tipo]}</span> <strong>Série ${c.n + 1}</strong> · ${c.texto}</li>`).join('')}
            </ul>
          </div>`).join('')
      : `<p class="vazio">${sessoes.length < 2
          ? 'Registre mais uma sessão para comparar as séries.'
          : 'Nenhuma mudança de carga ou repetições até agora.'}</p>`);
  }

  document.querySelectorAll('[data-metrica]').forEach((b) =>
    b.addEventListener('click', () => {
      metrica = b.dataset.metrica;
      document.querySelectorAll('[data-metrica]').forEach((x) =>
        x.setAttribute('aria-pressed', String(x === b)));
      desenharGrafico();
    }));

  $('#evo-exercicio').addEventListener('change', desenharEvolucao);
</script>
</body>
</html>
